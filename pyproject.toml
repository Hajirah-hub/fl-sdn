[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedsdn"
version = "0.1.0"
description = "Aggregation strategies for federated threat detection in multi-controller SDN"
requires-python = ">=3.13,<3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
